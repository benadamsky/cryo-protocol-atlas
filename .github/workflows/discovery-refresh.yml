name: Discovery Refresh

on:
  workflow_dispatch:
    inputs:
      skip_imports:
        description: Skip merging normalized import files before refresh
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "11 15 * * 1-5"

permissions:
  contents: write

concurrency:
  group: discovery-refresh
  cancel-in-progress: false

jobs:
  refresh-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.17"

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Typecheck
        run: bun run typecheck

      - name: Run Discovery Refresh
        env:
          SKIP_IMPORTS: ${{ github.event.inputs.skip_imports || 'false' }}
        run: |
          EXTRA_ARGS=""
          if [ "${SKIP_IMPORTS}" = "true" ]; then
            EXTRA_ARGS="--skip-imports"
          fi
          bun run discover-refresh:all -- ${EXTRA_ARGS}

      - name: Publish Discovery Summary
        run: |
          echo "# Discovery refresh" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat data/discovery/ovarian-tissue/import-summary.md >> "$GITHUB_STEP_SUMMARY"
          cat data/discovery/ovarian-tissue/promotion-queue.md >> "$GITHUB_STEP_SUMMARY"
          cat data/discovery/islets/import-summary.md >> "$GITHUB_STEP_SUMMARY"
          cat data/discovery/islets/promotion-queue.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit And Push Discovery Changes
        run: |
          if [ -z "$(git status --porcelain -- data/discovery)" ]; then
            echo "No discovery changes to commit."
            exit 0
          fi

          git add data/discovery
          git commit -m "chore(discovery): refresh discovery queue"
          git push origin HEAD:main
