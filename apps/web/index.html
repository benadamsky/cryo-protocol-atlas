<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cryo Atlas Observer</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <p class="eyebrow">Cryo Protocol Atlas</p>
        <h1>Observer Dashboard</h1>
        <p class="lede">
          A read-only operating surface for the bounded inner and outer autoresearch loops.
        </p>
        <div class="hero-meta" id="hero-meta"></div>
      </section>

      <section class="portfolio panel">
        <div class="panel-header">
          <div>
            <p class="section-label">Portfolio</p>
            <h2>System Health</h2>
          </div>
          <span class="status-pill" id="portfolio-status">Loading</span>
        </div>
        <div class="metric-grid" id="portfolio-metrics"></div>
      </section>

      <section class="domains">
        <div class="panel-header">
          <div>
            <p class="section-label">Domains</p>
            <h2>Run Status, Trust, Backlog, Progress</h2>
          </div>
        </div>
        <div class="domain-grid" id="domain-grid"></div>
      </section>
    </main>

    <template id="domain-template">
      <article class="domain-card panel">
        <div class="panel-header domain-top">
          <div>
            <p class="section-label domain-name"></p>
            <h3 class="domain-status-line"></h3>
          </div>
          <span class="status-pill domain-status-pill"></span>
        </div>
        <p class="domain-next-move"></p>
        <div class="domain-summary metric-grid"></div>
        <div class="subsection">
          <h4>Trust / Quality</h4>
          <div class="stat-list trust-list"></div>
        </div>
        <div class="subsection">
          <h4>Backlog</h4>
          <div class="stat-list backlog-list"></div>
        </div>
        <div class="subsection">
          <h4>Progress</h4>
          <div class="stat-list progress-list"></div>
        </div>
        <div class="subsection mismatch-block">
          <h4>Alerts</h4>
          <ul class="mismatch-list"></ul>
        </div>
      </article>
    </template>

    <script type="module" src="./app.js"></script>
  </body>
</html>
